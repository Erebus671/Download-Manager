name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Configure GitHubPackages credentials
        shell: pwsh
        run: >-
          dotnet nuget update source GitHubPackages
          --username Erebus671
          --password ${{ secrets.GH_PACKAGES_READ_TOKEN }}
          --store-password-in-clear-text
          --configfile nuget.ci.config

      - name: Restore
        run: dotnet restore DownloadManagerApplet.sln --configfile nuget.ci.config

      - name: Build
        run: dotnet build DownloadManagerApplet.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test DownloadManagerApplet.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
